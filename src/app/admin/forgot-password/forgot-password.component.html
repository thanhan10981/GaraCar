<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
</head>
<body>
<div class="forgot-password-container">
  <div class="forgot-password-box">
    <h2 class ="text">🔐 Quên mật khẩu</h2>

    <!-- Bước 1: Nhập email -->
    <input type="email" [(ngModel)]="email" placeholder="Nhập email đã đăng ký" required />
    <button (click)="guiOtp()">Gửi mã OTP</button>

   <!-- ✅ FORM BƯỚC 2: Chỉ hiện khi đã gửi OTP -->
  <div *ngIf="otpGuiThanhCong" class="otp-reset-section">
    <input type="text" [(ngModel)]="otp" placeholder="Nhập mã OTP" required />
    <input type="password" [(ngModel)]="newPassword" placeholder="Nhập mật khẩu mới" required />
    <button (click)="datLaiMatKhau()">Đặt lại mật khẩu</button>
  </div>


    <div *ngIf="thongBao" [ngClass]="thanhCong ? 'success' : 'error'" class="alert-box">
      {{ thongBao }}
    </div>
  </div>
</div>


</body>
</html>
