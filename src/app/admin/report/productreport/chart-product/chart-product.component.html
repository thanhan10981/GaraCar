<!-- Biểu đồ 1 -->
<div class="chart">
  <h5 class="chart-title">{{ titleChart1 }}</h5>

  <ngx-charts-bar-horizontal
    *ngIf="revenueData.length > 0"
    [view]="view"
    [scheme]="colorScheme"
    [results]="revenueData"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [legend]="showLegend"
    [showXAxisLabel]="showXAxisLabel"
    [xAxisLabel]="xAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [gradient]="true"
    [roundEdges]="true"
    [yAxisTickFormatting]="yAxisTickFormatting"
    [xAxisTickFormatting]="xAxisTickFormatting"
  >
  </ngx-charts-bar-horizontal>

  <div class="no-data" *ngIf="revenueData.length === 0">
    <i class="fas fa-chart-bar"></i>
    <p>Không có dữ liệu để hiển thị biểu đồ</p>
  </div>
</div>

<br>
